services:
  backend:
    build: .
    user: "${JANUS_RUNTIME_UID:-10001}:${JANUS_RUNTIME_GID:-10001}"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local,jwt
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-janussync}
      DB_USER: ${DB_USER:?Configura DB_USER en .env}
      DB_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
      DB_SSL_MODE: ${DB_SSL_MODE:-DISABLED}
      JANUS_JWT_PRIVATE_KEY: /run/keys/jwt-private.pem
      JANUS_JWT_PUBLIC_KEY: /run/keys/jwt-public.pem
      JANUS_JWT_ISSUER: ${JANUS_JWT_ISSUER:-janussync}
      JANUS_JWT_AUDIENCE: ${JANUS_JWT_AUDIENCE:-janussync-api}
      JANUS_ACCESS_TTL: ${JANUS_ACCESS_TTL:-PT5M}
      JANUS_REFRESH_TTL: ${JANUS_REFRESH_TTL:-P7D}
      JANUS_COOKIE_SECURE: ${JANUS_COOKIE_SECURE:-false}
      JANUS_ALLOW_NO_CAPTCHA_LOCAL: ${JANUS_ALLOW_NO_CAPTCHA_LOCAL:-true}
      ACADEMUSOFT_MECANISMO: ${ACADEMUSOFT_MECANISMO:-ORACLE}
      ACADEMUSOFT_ORACLE_URL: ${ACADEMUSOFT_ORACLE_URL:-}
      ACADEMUSOFT_ORACLE_USERNAME: ${ACADEMUSOFT_ORACLE_USERNAME:-}
      ACADEMUSOFT_ORACLE_PASSWORD: ${ACADEMUSOFT_ORACLE_PASSWORD:-}
      ACADEMUSOFT_PROGRAMAS_CONNECTION_TIMEOUT: ${ACADEMUSOFT_PROGRAMAS_CONNECTION_TIMEOUT:-PT5S}
      ACADEMUSOFT_PROGRAMAS_QUERY_TIMEOUT: ${ACADEMUSOFT_PROGRAMAS_QUERY_TIMEOUT:-PT10S}
      JANUS_PROGRAMAS_SYNC_ENABLED: ${JANUS_PROGRAMAS_SYNC_ENABLED:-true}
      JANUS_PROGRAMAS_SYNC_CRON: ${JANUS_PROGRAMAS_SYNC_CRON:-0 0 2 * * *}
      JANUS_PROGRAMAS_SYNC_ZONE: ${JANUS_PROGRAMAS_SYNC_ZONE:-America/Bogota}
      JANUS_PROGRAMAS_MAX_AGE: ${JANUS_PROGRAMAS_MAX_AGE:-PT48H}
      JANUS_PROGRAMAS_UPDATE_COOLDOWN: ${JANUS_PROGRAMAS_UPDATE_COOLDOWN:-PT1M}
      BRIGHTSPACE_MODE: ${BRIGHTSPACE_MODE:-real}
      BRIGHTSPACE_BASE_URL: ${BRIGHTSPACE_BASE_URL:-}
      BRIGHTSPACE_API_VERSION: ${BRIGHTSPACE_API_VERSION:-}
      BRIGHTSPACE_APP_ID: ${BRIGHTSPACE_APP_ID:-}
      BRIGHTSPACE_APP_KEY: ${BRIGHTSPACE_APP_KEY:-}
      BRIGHTSPACE_USER_ID: ${BRIGHTSPACE_USER_ID:-}
      BRIGHTSPACE_USER_KEY: ${BRIGHTSPACE_USER_KEY:-}
      JANUS_CONNECTION_TIMEOUT: ${JANUS_CONNECTION_TIMEOUT:-PT3S}
      JANUS_CHECK_TIMEOUT: ${JANUS_CHECK_TIMEOUT:-PT10S}
      JANUS_CHECK_COOLDOWN: ${JANUS_CHECK_COOLDOWN:-PT1M}
      JANUS_CHECK_STALE_MINUTES: ${JANUS_CHECK_STALE_MINUTES:-15}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-sandbox.smtp.mailtrap.io}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-from@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-JanusSync}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_STARTTLS_ENABLED: ${MAIL_STARTTLS_ENABLED:-true}
      MAIL_STARTTLS_REQUIRED: ${MAIL_STARTTLS_REQUIRED:-true}
      MAIL_SSL_ENABLED: ${MAIL_SSL_ENABLED:-false}
      MAIL_CONNECTION_TIMEOUT_MS: ${MAIL_CONNECTION_TIMEOUT_MS:-5000}
      MAIL_READ_TIMEOUT_MS: ${MAIL_READ_TIMEOUT_MS:-10000}
      MAIL_WRITE_TIMEOUT_MS: ${MAIL_WRITE_TIMEOUT_MS:-10000}
      JANUS_FRONTEND_PUBLIC_URL: ${JANUS_FRONTEND_PUBLIC_URL:-http://localhost:3000}
      JANUS_INVITATION_TTL: ${JANUS_INVITATION_TTL:-P7D}
      JANUS_RESET_TTL: ${JANUS_RESET_TTL:-PT60M}
      JANUS_EMAIL_COOLDOWN: ${JANUS_EMAIL_COOLDOWN:-PT1M}
      TZ: America/Bogota
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${JANUS_KEYS_DIR:?Configura JANUS_KEYS_DIR fuera del repositorio}:/run/keys:ro
    networks:
      - janussync
    init: true
networks:
  janussync:
    name: janussync-local
