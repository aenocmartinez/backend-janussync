spring:
  application:
    name: backend-janussync
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:janussync}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&sslMode=${DB_SSL_MODE:PREFERRED}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 10000
  flyway:
    enabled: true
    validate-on-migrate: true
    clean-disabled: true
  mvc:
    problemdetails:
      enabled: true
server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

---
spring:
  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS_ENABLED:true}
      mail.smtp.starttls.required: ${MAIL_STARTTLS_REQUIRED:true}
      mail.smtp.ssl.enable: ${MAIL_SSL_ENABLED:false}
      mail.smtp.ssl.checkserveridentity: true
      mail.smtp.connectiontimeout: ${MAIL_CONNECTION_TIMEOUT_MS:5000}
      mail.smtp.timeout: ${MAIL_READ_TIMEOUT_MS:10000}
      mail.smtp.writetimeout: ${MAIL_WRITE_TIMEOUT_MS:10000}
      mail.debug: false
management:
  health:
    mail:
      enabled: false
janussync:
  correo:
    habilitado: ${MAIL_ENABLED:false}
    remitente: ${MAIL_FROM:from@example.com}
    nombre-remitente: ${MAIL_FROM_NAME:JanusSync}
    url-publica: ${JANUS_FRONTEND_PUBLIC_URL:http://localhost:3000}
    invitacion-ttl: ${JANUS_INVITATION_TTL:P7D}
    recuperacion-ttl: ${JANUS_RESET_TTL:PT60M}

    pausa-envios: ${JANUS_EMAIL_COOLDOWN:PT1M}
